# import variables into system-user environment
# See https://wiki.archlinux.org/title/XDG_Desktop_Portal for details

# Hyprland on Ubuntu does not start a graphical session, so do it here.
# graphical-session.target sets RefuseManualStart, so start hyprland-session.target
# (which BindsTo it) instead. Chained onto the imports rather than a separate
# exec line so session units never come up before WAYLAND_DISPLAY is set.
exec = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE; hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland HYPRLAND_INSTANCE_SIGNATURE; systemctl --user start hyprland-session.target
