# Default theme variables. Sourced before the theme so themes can override them.

$activeBorder = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorder = rgba(595959aa)

# Groupbar tab background/text; themes set these from their bar colors.
$groupBarBackground = rgb(1a1b26)
$groupBarText = rgb(cdd6f4)
