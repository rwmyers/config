###############
### PLUGINS ###
###############

# hyprexpo: workspace overview, like macOS Mission Control. Ubuntu ships this
# prebuilt against the distro Hyprland, so hyprpm isn't needed.
plugin = /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprexpo.so

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        # "center current" only backtracks 3 of the 4 tiles it needs, so
        # workspace 1 drops off the grid once you're on 5+. Anchor at 1.
        workspace_method = first 1
        # A swipe commits past half this distance, else it snaps back. 300
        # meant 150 units of travel, which was too long to close reliably.
        gesture_distance = 150
    }
}

# Three-finger swipe up, like macOS. Direction separates this from the
# three-finger horizontal workspace swipe in input.conf.
hyprexpo-gesture = 3, up, expo
# Down closes it. `expo` is the only gesture action, and it toggles, so a
# down-swipe from a normal desktop opens the overview too.
hyprexpo-gesture = 3, down, expo
bind = $mainMod, G, hyprexpo:expo, toggle
