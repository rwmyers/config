#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,48
env = HYPRCURSOR_SIZE,48
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
env = PATH,$HOME/.nix-profile/bin:$PATH:$HOME/.local/bin/:$HOME/bin/

# Let the session (walker etc.) find + launch Nix / Home Manager apps.
env = XDG_DATA_DIRS,$HOME/.nix-profile/share:/nix/var/nix/profiles/default/share:$XDG_DATA_DIRS

# Fixes screen sharing for some applications
# https://github.com/hyprwm/xdg-desktop-portal-hyprland/issues/99#issuecomment-1731390092
env = bitdepth,10
