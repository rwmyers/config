#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet &
# exec-once = hyprpaper & firefox
exec-once = wl-paste --watch cliphist store
# Keep walker resident so the launcher/menus open instantly instead of cold-starting.
exec-once = walker --gapplication-service
exec = ~/.config/waybar/scripts/restart_waybar.sh

#####################
### IDLE AND LOCK ###
#####################
exec = pkill swayidle; $idle

##################
### BACKGROUND ###
##################
exec-once = swaybg -i ~/themes/current/background

####################
### MONITOR MODE ###
####################
# Pick the right monitor config for the current lid state on session start.
# Explicit path: the session PATH may not include ~/bin when this runs.
exec-once = ~/bin/hypr-monitor-mode --auto
