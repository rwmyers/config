# Default monitor configuration (lid open).
# Edit per machine. Easiest way to regenerate: run nwg-displays.

# The internal panel enumerates as eDP-1 on some machines and eDP-2 on others.
# Listing both is harmless: Hyprland ignores rules for outputs that don't exist.
monitor=eDP-1,preferred,auto,1.0
monitor=eDP-2,preferred,auto,1.0
