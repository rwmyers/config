# Lid-closed monitor configuration.
# External monitors are auto-applied by the catch-all
# `monitor=,preferred,auto,auto` in hyprland/monitor.conf.

# The internal panel enumerates as eDP-1 on some machines and eDP-2 on others.
# Listing both is harmless: Hyprland ignores rules for outputs that don't exist.
monitor=eDP-1,disable
monitor=eDP-2,disable
