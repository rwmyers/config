# Installed to /etc/default/grub.d/99-dotfiles.cfg by install/etc/grub.sh.
# grub-mkconfig sources /etc/default/grub.d/*.cfg after /etc/default/grub, so
# these win without having to edit the packaged file in place.

# Enables gfxmenu: bigger font and a centered menu box. See grub/theme.txt.
GRUB_THEME=/boot/grub/themes/ristretto/theme.txt

# `auto` keeps whatever mode the firmware hands over, which on some desktop
# boards is 1024x768 stretched across the panel. Try native-ish modes first;
# unsupported entries are skipped.
GRUB_GFXMODE=3840x2160,2560x1600,1920x1080,auto

# grub-mkconfig defaults this to `auto`, which only runs os-prober if the
# existing grub.cfg already has osprober entries - so Windows never appears
# on a fresh install. 11_linux_windows needs its output to list Windows.
GRUB_DISABLE_OS_PROBER=false
