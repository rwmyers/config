# Installed to /etc/default/grub.d/99-dotfiles.cfg by install/etc/grub.sh.
# grub-mkconfig sources /etc/default/grub.d/*.cfg after /etc/default/grub, so
# these win without having to edit the packaged file in place.

# Enables gfxmenu: bigger font and a centered menu box. See grub/theme.txt.
GRUB_THEME=/boot/grub/themes/ristretto/theme.txt
