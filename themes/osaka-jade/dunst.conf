# Colors for the osaka-jade theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#214237"
    separator_color = frame

[urgency_low]
    background = "#11221c"
    foreground = "#c1c497"
    frame_color = "#214237"
    highlight = "#214237"

[urgency_normal]
    background = "#11221c"
    foreground = "#c1c497"
    frame_color = "#214237"
    highlight = "#214237"

[urgency_critical]
    background = "#11221c"
    foreground = "#c1c497"
    frame_color = "#ff5345"
    highlight = "#ff5345"
