# Colors for the catppuccin-latte theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#1e66f5"
    separator_color = frame

[urgency_low]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#1e66f5"
    highlight = "#1e66f5"

[urgency_normal]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#1e66f5"
    highlight = "#1e66f5"

[urgency_critical]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#d20f39"
    highlight = "#d20f39"
