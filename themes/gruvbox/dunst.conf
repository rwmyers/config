# Colors for the gruvbox theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#a89984"
    separator_color = frame

[urgency_low]
    background = "#282828"
    foreground = "#d4be98"
    frame_color = "#a89984"
    highlight = "#a89984"

[urgency_normal]
    background = "#282828"
    foreground = "#d4be98"
    frame_color = "#a89984"
    highlight = "#a89984"

[urgency_critical]
    background = "#282828"
    foreground = "#d4be98"
    frame_color = "#ea6962"
    highlight = "#ea6962"
