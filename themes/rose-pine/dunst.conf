# Colors for the rose-pine theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#575279"
    separator_color = frame

[urgency_low]
    background = "#faf4ed"
    foreground = "#575279"
    frame_color = "#575279"
    highlight = "#575279"

[urgency_normal]
    background = "#faf4ed"
    foreground = "#575279"
    frame_color = "#575279"
    highlight = "#575279"

[urgency_critical]
    background = "#faf4ed"
    foreground = "#575279"
    frame_color = "#b4637a"
    highlight = "#b4637a"
