# Colors for the kanagawa theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#dcd7ba"
    separator_color = frame

[urgency_low]
    background = "#1f1f28"
    foreground = "#dcd7ba"
    frame_color = "#dcd7ba"
    highlight = "#dcd7ba"

[urgency_normal]
    background = "#1f1f28"
    foreground = "#dcd7ba"
    frame_color = "#dcd7ba"
    highlight = "#dcd7ba"

[urgency_critical]
    background = "#1f1f28"
    foreground = "#dcd7ba"
    frame_color = "#c34043"
    highlight = "#c34043"
