# Colors for the catppuccin theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#c6d0f5"
    separator_color = frame

[urgency_low]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#c6d0f5"
    highlight = "#c6d0f5"

[urgency_normal]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#c6d0f5"
    highlight = "#c6d0f5"

[urgency_critical]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#ed8796"
    highlight = "#ed8796"
