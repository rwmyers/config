# Colors for the everforest theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#d3c6aa"
    separator_color = frame

[urgency_low]
    background = "#2d353b"
    foreground = "#d3c6aa"
    frame_color = "#d3c6aa"
    highlight = "#d3c6aa"

[urgency_normal]
    background = "#2d353b"
    foreground = "#d3c6aa"
    frame_color = "#d3c6aa"
    highlight = "#d3c6aa"

[urgency_critical]
    background = "#2d353b"
    foreground = "#d3c6aa"
    frame_color = "#e67e80"
    highlight = "#e67e80"
