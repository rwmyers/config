# Colors for the nord theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#d8dee9"
    separator_color = frame

[urgency_low]
    background = "#2e3440"
    foreground = "#d8dee9"
    frame_color = "#d8dee9"
    highlight = "#d8dee9"

[urgency_normal]
    background = "#2e3440"
    foreground = "#d8dee9"
    frame_color = "#d8dee9"
    highlight = "#d8dee9"

[urgency_critical]
    background = "#2e3440"
    foreground = "#d8dee9"
    frame_color = "#bf616a"
    highlight = "#bf616a"
