# Colors for the matte-black theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#8a8a8d"
    separator_color = frame

[urgency_low]
    background = "#1e1e1e"
    foreground = "#8a8a8d"
    frame_color = "#8a8a8d"
    highlight = "#8a8a8d"

[urgency_normal]
    background = "#1e1e1e"
    foreground = "#8a8a8d"
    frame_color = "#8a8a8d"
    highlight = "#8a8a8d"

[urgency_critical]
    background = "#1e1e1e"
    foreground = "#8a8a8d"
    frame_color = "#d35f5f"
    highlight = "#d35f5f"
