# Colors for the ristretto theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#e6d9db"
    separator_color = frame

[urgency_low]
    background = "#2c2525"
    foreground = "#e6d9db"
    frame_color = "#e6d9db"
    highlight = "#e6d9db"

[urgency_normal]
    background = "#2c2525"
    foreground = "#e6d9db"
    frame_color = "#e6d9db"
    highlight = "#e6d9db"

[urgency_critical]
    background = "#2c2525"
    foreground = "#e6d9db"
    frame_color = "#fd6883"
    highlight = "#fd6883"
