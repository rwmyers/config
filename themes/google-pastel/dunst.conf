# Colors for the google-pastel theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#8ab4f8"
    separator_color = frame

[urgency_low]
    background = "#202124"
    foreground = "#e3e3e3"
    frame_color = "#8ab4f8"
    highlight = "#8ab4f8"

[urgency_normal]
    background = "#202124"
    foreground = "#e3e3e3"
    frame_color = "#8ab4f8"
    highlight = "#8ab4f8"

[urgency_critical]
    background = "#202124"
    foreground = "#e3e3e3"
    frame_color = "#f28b82"
    highlight = "#f28b82"
