# Colors for the tokyo-night theme. Loaded from ~/themes/current/dunst.conf via the
# dunstrc.d drop-in, so switching themes reskins notifications. Layout lives in
# dunstrc; this file is colors only.
[global]
    frame_color = "#33ccff"
    separator_color = frame

[urgency_low]
    background = "#1a1b26"
    foreground = "#a9b1d6"
    frame_color = "#33ccff"
    highlight = "#33ccff"

[urgency_normal]
    background = "#1a1b26"
    foreground = "#a9b1d6"
    frame_color = "#33ccff"
    highlight = "#33ccff"

[urgency_critical]
    background = "#1a1b26"
    foreground = "#a9b1d6"
    frame_color = "#f7768e"
    highlight = "#f7768e"
